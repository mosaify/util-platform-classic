[versions]
kotlin = "2.4.21"
klogging = "0.11.8"
kotlinx-io = "0.9.3"
maven-publish = "0.37.0"
junit = "6.1.3"
kotest = "6.2.7"
ksp = "2.3.14"

[plugins]
kotlin-plugin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotest = { id = "io.kotest", version.ref = "kotest" }

[libraries]
klogging = { module = "io.klogging:klogging", version.ref = "klogging" }
kotlinx-io = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotest-bom = { module = "io.kotest:kotest-bom", version.ref = "kotest" }
kotest-runner-junit6 = { module = "io.kotest:kotest-runner-junit6" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core" }
